[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "native-rag"
version = "0.1.0"
description = "Document-focused Native RAG for local Transformers language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.6",
  "transformers>=5.14,<6",
  "bitsandbytes>=0.49",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
benchmark = ["pandas>=2", "pyarrow>=15", "tiktoken>=0.7"]

[project.scripts]
native-rag = "native_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
